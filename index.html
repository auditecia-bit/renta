<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GestiónRenta — Panel de Asesoría</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#F9F8F5;--card:#fff;--bg2:#F2F1EE;--bg3:#E8E7E3;
  --brd:rgba(0,0,0,.09);--brd2:rgba(0,0,0,.16);
  --txt:#1A1A1A;--txt2:#5C5C5C;--txt3:#999;
  --nv:#1E2A3A;--nvd:#141F2D;--gd:#C8973A;--glt:#E0B055;
  --em:#10B981;--emlt:#D1FAE5;--emdk:#065F46;
  --danger:#DC2626;--warn:#D97706;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--txt);min-height:100vh}
/* ─ LAYOUT ─ */
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
.tnav{background:var(--nv);border-radius:12px 12px 0 0;display:flex;align-items:stretch;padding:0 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;padding:0 14px 0 0;border-right:1px solid rgba(255,255,255,.12);margin-right:6px;min-height:46px;flex-shrink:0}
.bico{width:26px;height:26px;background:var(--gd);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--nv)}
.bname{font-size:12px;font-weight:500;color:#fff;white-space:nowrap}
.byear{font-size:10px;color:rgba(255,255,255,.45);white-space:nowrap}
.ntab{padding:0 12px;border:none;background:none;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;min-height:46px;transition:all .15s;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.ntab:hover{color:rgba(255,255,255,.85)}.ntab.on{color:#fff;border-bottom-color:var(--gd)}
.nspc{flex:1}
.addbtn{padding:6px 12px;background:var(--gd);color:var(--nv);border:none;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;align-self:center;flex-shrink:0}
.addbtn:hover{background:var(--glt)}
.cnt{background:var(--bg);border:0.5px solid var(--brd);border-top:none;border-radius:0 0 12px 12px;padding:20px;min-height:500px}
/* ─ CARDS ─ */
.card{background:var(--card);border:0.5px solid var(--brd);border-radius:10px;padding:16px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.sc{background:var(--bg2);border-radius:8px;padding:13px}
.scl{font-size:11px;color:var(--txt2);margin-bottom:3px}
.scv{font-size:22px;font-weight:500;color:var(--txt)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px}
.cc{background:var(--card);border:0.5px solid var(--brd);border-radius:10px;padding:13px;cursor:pointer;transition:border-color .15s}
.cc:hover{border-color:var(--gd)}
.av{width:34px;height:34px;border-radius:50%;background:var(--nv);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--gd);flex-shrink:0}
/* ─ PROGRESS ─ */
.pt{height:4px;background:var(--bg3);border-radius:2px;flex:1}
.pf{height:4px;border-radius:2px;transition:width .4s ease}.pf-g{background:var(--gd)}.pf-e{background:var(--em)}
/* ─ BADGES ─ */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:500}
.bdg::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.b-p{background:#FEF3C7;color:#92400E}.b-p::before{background:#F59E0B}
.b-e{background:#DBEAFE;color:#1E40AF}.b-e::before{background:#3B82F6}
.b-c{background:var(--emlt);color:var(--emdk)}.b-c::before{background:var(--em)}
.b-pr{background:#EDE9FE;color:#4C1D95}.b-pr::before{background:#8B5CF6}
/* ─ TABLE ─ */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 13px;color:var(--txt2);font-weight:500;border-bottom:0.5px solid var(--brd);background:var(--bg2);font-size:11px;white-space:nowrap}
td{padding:10px 13px;border-bottom:0.5px solid var(--brd);color:var(--txt);vertical-align:middle}
tr:hover td{background:var(--bg2);cursor:pointer}
/* ─ DETAIL LAYOUT ─ */
.dl{display:grid;grid-template-columns:190px 1fr;gap:13px;align-items:start}
@media(max-width:640px){.dl{grid-template-columns:1fr}}
.clist{display:flex;flex-direction:column;gap:2px}
.cbtn{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:7px;border:none;background:none;cursor:pointer;width:100%;text-align:left;font-size:11px;color:var(--txt2);font-family:inherit;transition:background .1s}
.cbtn:hover{background:var(--bg2)}.cbtn.on{background:var(--nv);color:#fff}.cbtn.on .cct{color:rgba(255,255,255,.5)}
.cct{margin-left:auto;font-size:10px;color:var(--txt3)}
/* ─ CHECKLIST ITEMS ─ */
.chi{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border-radius:7px;border:0.5px solid var(--brd);cursor:pointer;transition:all .12s;margin-bottom:6px}
.chi:hover{border-color:var(--brd2);background:var(--bg2)}
.chi.chk{background:#F0FDF4;border-color:#A7F3D0}
.chi.warn{background:#FFFBEB;border-color:#FCD34D}
.chbox{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--brd2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;transition:all .12s}
.chbox.chk{background:var(--em);border-color:var(--em)}
.cht{font-size:12px;font-weight:500;color:var(--txt)}
.cht.done{text-decoration:line-through;color:var(--txt3)}
.chd{font-size:11px;color:var(--txt2);margin-top:1px;line-height:1.4}
/* ─ FORMS ─ */
.fg{margin-bottom:11px}
.fl{display:block;font-size:11px;font-weight:500;color:var(--txt2);margin-bottom:4px}
.fi,.fs,.fta{width:100%;padding:7px 9px;border:0.5px solid var(--brd2);border-radius:7px;background:var(--card);font-size:12px;color:var(--txt);font-family:inherit;outline:none}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--gd);box-shadow:0 0 0 2px rgba(200,151,58,.15)}
.fta{resize:vertical}
.bp{background:var(--nv);color:#fff;border:none;padding:8px 15px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
.bp:hover{background:var(--nvd)}
.bs{background:none;color:var(--txt2);border:0.5px solid var(--brd2);padding:8px 15px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit}
.bs:hover{background:var(--bg2)}
.btn-sm{padding:4px 9px;border-radius:5px;border:0.5px solid var(--brd2);background:none;font-size:11px;color:var(--txt2);cursor:pointer;font-family:inherit}
.btn-sm:hover{background:var(--bg2)}
.btn-danger{color:var(--danger);border-color:rgba(220,38,38,.2)}
.btn-danger:hover{background:#FEF2F2}
/* ─ MODAL ─ */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-start;justify-content:center;padding-top:40px}
.mov.open{display:flex}
.mcard{background:var(--card);border-radius:12px;width:100%;max-width:420px;padding:22px;margin:0 14px;border:0.5px solid var(--brd);max-height:85vh;overflow-y:auto}
/* ─ TAGS ─ */
.ntag{display:inline-flex;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600;background:#DBEAFE;color:#1E40AF;margin-left:5px;vertical-align:middle}
.wtag{display:inline-flex;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600;background:#FEF3C7;color:#92400E;margin-left:5px;vertical-align:middle}
/* ─ CUSTOM ITEMS FORM ─ */
.custom-form{border:1px dashed var(--brd2);border-radius:8px;padding:12px;margin-top:8px;background:var(--bg2)}
.custom-form-title{font-size:11px;font-weight:500;color:var(--txt2);margin-bottom:8px}
/* ─ MISC ─ */
.empty{text-align:center;padding:50px 20px;color:var(--txt2)}
.bkbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--txt2);cursor:pointer;border:none;background:none;padding:0;margin-bottom:12px;font-family:inherit}
.bkbtn:hover{color:var(--txt)}
.sh{font-size:12px;font-weight:500;color:var(--txt);margin-bottom:10px}
.abt{border:none;background:none;cursor:pointer;font-size:11px;color:var(--txt2);padding:2px 5px;font-family:inherit}
.abt:hover{color:var(--txt)}
.delbtn{border:none;background:none;cursor:pointer;font-size:11px;color:var(--danger);padding:2px 5px;font-family:inherit}
.del-item{border:none;background:none;cursor:pointer;color:var(--danger);font-size:14px;padding:0 3px;line-height:1;flex-shrink:0;margin-top:1px}
/* ─ FISCAL CARD ─ */
.fiscal-card{background:var(--card);border:0.5px solid var(--brd);border-radius:10px;padding:16px;margin-bottom:13px}
.fiscal-section{border-top:0.5px solid var(--brd);padding-top:12px;margin-top:12px}
.hint{font-size:10px;color:var(--txt3);margin-top:3px;line-height:1.4}
/* ─ PRINT ─ */
@media print{
  .tnav,.addbtn,.bkbtn,.abt,.delbtn,.del-item,.fiscal-card,.clist,.custom-form,.btn-sm,.bp,.bs,
  button,.no-print{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .wrap{padding:0;max-width:100%}
  .cnt{border:none;border-radius:0;padding:0}
  .card{border:none;border-radius:0;padding:0;box-shadow:none}
  .dl{display:block}
  .chi{break-inside:avoid;border:0.5px solid #ddd;margin-bottom:4px}
  .print-header{display:block!important}
}
.print-header{display:none}
/* ─ CATEGORY NOTES ─ */
.cat-notes{margin-top:14px;border-top:0.5px solid var(--brd);padding-top:12px}
.cat-notes-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cat-notes-lbl{font-size:11px;font-weight:600;color:var(--txt2);display:flex;align-items:center;gap:5px}
.cat-notes-dot{width:6px;height:6px;border-radius:50%;background:var(--gd);flex-shrink:0}
.cat-notes textarea{width:100%;padding:8px 10px;border:0.5px solid var(--brd2);border-radius:7px;background:var(--bg2);font-size:11.5px;color:var(--txt);font-family:inherit;resize:vertical;min-height:60px;outline:none;line-height:1.5;transition:border-color .15s}
.cat-notes textarea:focus{border-color:var(--gd);background:var(--card);box-shadow:0 0 0 2px rgba(200,151,58,.12)}
.notes-saved{font-size:10px;color:var(--em);opacity:0;transition:opacity .3s}
.notes-saved.show{opacity:1}
/* ─ CATEGORY INFO PANEL ─ */
.cat-info{background:linear-gradient(135deg,#1E2A3A 0%,#243347 100%);border-radius:8px;padding:13px 15px;margin-bottom:14px;color:#fff}
.cat-info-title{font-size:11px;font-weight:600;color:var(--gd);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.cat-info-desc{font-size:11px;color:rgba(255,255,255,.8);line-height:1.5;margin-bottom:9px}
.cat-tips{display:flex;flex-direction:column;gap:4px}
.cat-tip{display:flex;align-items:flex-start;gap:6px;font-size:10.5px;color:rgba(255,255,255,.65);line-height:1.4}
.cat-tip-ico{font-size:11px;flex-shrink:0;margin-top:1px}
.cat-tip strong{color:rgba(255,255,255,.9);font-weight:600}
/* ─ DRIVE ─ */
.drive-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:5px;border:0.5px solid var(--brd2);background:none;font-size:11px;cursor:pointer;font-family:inherit;color:var(--txt2);flex-shrink:0;align-self:center}
.drive-btn:hover{background:var(--bg2)}
.drive-btn.connected{border-color:#34A853;color:#34A853;background:#F0FDF4}
.drive-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.up-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;border:0.5px solid var(--brd2);background:none;font-size:10px;cursor:pointer;color:var(--txt2);font-family:inherit;flex-shrink:0;margin-top:3px;white-space:nowrap}
.up-btn:hover{background:var(--bg2)}
.up-btn.uploaded{border-color:#34A853;color:#34A853;background:#F0FDF4}
.drive-link{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#1A73E8;text-decoration:none;margin-top:3px}
.drive-link:hover{text-decoration:underline}
.uploading{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <div id="app">
    <nav class="tnav" id="tnav">
      <div class="brand">
        <div class="bico">GR</div>
        <div><div class="bname">GestiónRenta</div><div class="byear">Campaña Renta 2025</div></div>
      </div>
      <button class="ntab on" id="tb-dash" onclick="nav('dash')">Dashboard</button>
      <button class="ntab" id="tb-cli" onclick="nav('cli')">Clientes</button>
      <div id="tb-cw"></div>
      <div class="nspc"></div>
      <button id="drive-btn" class="drive-btn" onclick="driveConnect()" style="margin-right:8px">
        <span class="drive-dot"></span><span id="drive-lbl">Conectar Drive</span>
      </button>
      <button class="addbtn" onclick="openMod()">+ Nuevo cliente</button>
    </nav>
    <div class="cnt" id="cnt"></div>
  </div>
</div>

<!-- MODAL -->
<div class="mov" id="mod" onclick="bgClk(event)">
  <div class="mcard" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <span style="font-size:13px;font-weight:600;color:var(--txt)" id="mtit">Nuevo cliente</span>
      <button onclick="closeMod()" style="border:none;background:none;font-size:18px;cursor:pointer;color:var(--txt2);line-height:1">&times;</button>
    </div>
    <div id="mbody"></div>
  </div>
</div>

<!-- EMAIL MODAL -->
<div class="mov" id="emod" onclick="if(event.target===this)closeEmail()">
  <div class="mcard" style="max-width:640px" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span style="font-size:13px;font-weight:600;color:var(--txt)">✉ Generar email para el cliente</span>
      <button onclick="closeEmail()" style="border:none;background:none;font-size:18px;cursor:pointer;color:var(--txt2);line-height:1">&times;</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button id="etone-c" class="btn-sm" onclick="setTone('cercano')" style="flex:1">👋 Cercano y directo</button>
      <button id="etone-f" class="btn-sm" onclick="setTone('formal')" style="flex:1">🏛 Formal</button>
    </div>
    <div style="margin-bottom:8px;font-size:10px;color:var(--txt3)">Edita el texto a tu gusto antes de copiarlo</div>
    <textarea id="email-body" class="fta" rows="18" style="font-size:12px;line-height:1.6"></textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="bs" onclick="closeEmail()">Cerrar</button>
      <button class="bp" id="copy-btn" onclick="copyEmail()" style="flex:1">Copiar texto</button>
      <button class="bp" id="mailto-btn" style="background:#0F766E;flex:1" onclick="mailtoEmail()">Abrir en email</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  DATOS
// ═══════════════════════════════════════════════════════
const CCAA=[
  {id:'and',n:'Andalucía',e:'🌻'},{id:'ara',n:'Aragón',e:'⚔️'},{id:'ast',n:'Asturias',e:'🌿'},
  {id:'bal',n:'Baleares',e:'⛵'},{id:'can',n:'Canarias',e:'🌋'},{id:'ctb',n:'Cantabria',e:'🏔️'},
  {id:'clm',n:'Castilla-La Mancha',e:'⚙️'},{id:'cyl',n:'Castilla y León',e:'🏰'},
  {id:'cat',n:'Cataluña',e:'🌹'},{id:'val',n:'C. Valenciana',e:'🍊'},
  {id:'ext',n:'Extremadura',e:'🦅'},{id:'gal',n:'Galicia',e:'🐚'},
  {id:'rio',n:'La Rioja',e:'🍇'},{id:'mad',n:'Madrid',e:'🏛️'},
  {id:'mur',n:'Murcia',e:'☀️'},{id:'nav',n:'Navarra (Foral)',e:'⚜️'},
  {id:'vas',n:'País Vasco (Foral)',e:'🌊'},
];
const CATS=[
  {id:'personales',l:'Datos Personales'},
  {id:'trabajo',l:'Rendimientos del Trabajo'},
  {id:'inmuebles',l:'Inmuebles y Alquileres'},
  {id:'bancos',l:'Bancos e Inversiones'},
  {id:'patrimonio',l:'Ganancias Patrimoniales'},
  {id:'estatal',l:'Deducciones Estatales'},
  {id:'autonomica',l:'Deducciones Autonómicas'},
  {id:'extra',l:'Notas y docs. adicionales'},
];
const COM=[
  // PERSONALES
  {id:'dni',c:'personales',t:'DNI/NIE titular y cónyuge (si aplica)',d:'Vigente. Incluir fecha de caducidad.'},
  {id:'lfam',c:'personales',t:'Libro de familia o certificado matrimonio/nacimiento',d:'Para hijos menores de 25 años o acreditar estado civil.'},
  {id:'disc',c:'personales',t:'Certificado de discapacidad — titular (si aplica)',d:'Grado ≥33%. Emitido por organismo competente autonómico.'},
  {id:'disc2',c:'personales',t:'Certificado de discapacidad del cónyuge (si aplica)',d:'Deducción estatal 1.200€/año si cónyuge con discapacidad y sin rentas >8.000€.'},
  {id:'fnum',c:'personales',t:'Título de Familia Numerosa o Monoparental',d:'Vigente a 31 de diciembre del ejercicio.'},
  {id:'depend',c:'personales',t:'Resolución de grado de dependencia (si aplica)',d:'Para ascendientes o descendientes dependientes. Emitida por organismo autonómico.'},

  {id:'cemp',c:'trabajo',t:'Certificado de retenciones de la empresa',d:'De todos los pagadores del año. RRHH lo emite obligatoriamente.'},
  {id:'sepe',c:'trabajo',t:'Certificado SEPE — paro/ERTE (si aplica)',d:'Descargable en sede electrónica del SEPE con certificado digital.'},
  {id:'sind',c:'trabajo',t:'Cuota sindical / Colegio profesional (si colegiación obligatoria)',d:'Justificante de pago. Reducción en gastos deducibles del trabajo.'},
  {id:'cotss',c:'trabajo',t:'Justificante cotizaciones SS (deducción maternidad)',d:'Para madres con hijos menores de 3 años que coticen. Deducción 1.200€ + hasta 1.000€ por guardería.'},

  {id:'ibi',c:'inmuebles',t:'Referencia catastral de la vivienda habitual',d:'Aparece en el recibo del IBI. Necesaria para imputación de rentas.'},

  {id:'bfis',c:'bancos',t:'Información fiscal de bancos / brokers',d:'Intereses de cuentas, dividendos. Descargable en banca online (sección fiscal).'},
  {id:'resc',c:'bancos',t:'Rescates de seguros / PIAS / planes de ahorro',d:'Solo si has realizado rescates o cobrado rentas vitalicias.'},

  {id:'escr',c:'patrimonio',t:'Escrituras de compra y venta (si vendiste inmueble)',d:'Ambas escrituras + gastos notaría, plusvalía municipal, comisión inmobiliaria.'},

  {id:'subv',c:'patrimonio',t:'Ayudas públicas cobradas (MOVES, Bono Alquiler, DANA…)',d:'Resolución de concesión + justificante bancario. Tributan como ganancia patrimonial.'},
  // ESTATALES
  {id:'hip',c:'estatal',t:'Recibo hipoteca vivienda habitual (compra anterior al 01/01/2013)',d:'Solo para compras antes del 1 enero 2013. Máx. deducción 9.040€ base / 15%.'},

  {id:'mat',c:'estatal',t:'Facturas guardería + justificante cotización SS (deducción maternidad)',d:'Madres con hijos <3 años que trabajen y coticen. Hasta 1.000€ adicionales/año por guardería.'},

// ═══════════════════════════════════════════════════════
//  STORAGE (localStorage)
// ═══════════════════════════════════════════════════════
function loadAll(){
  try{const r=localStorage.getItem('gr-clients');if(r)clients=JSON.parse(r);}catch(e){clients=[];}
  for(const c of clients){
    try{const r=localStorage.getItem('gr-p-'+c.id);prog[c.id]=new Set(r?JSON.parse(r):[]);}
    catch(e){prog[c.id]=new Set();}
  }
}
function svC(){try{localStorage.setItem('gr-clients',JSON.stringify(clients));}catch(e){}}
function svP(cid){try{localStorage.setItem('gr-p-'+cid,JSON.stringify([...prog[cid]]));}catch(e){}}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function ccn(id){const c=CCAA.find(v=>v.id===id);return c?c.e+' '+c.n:id;}
function items(cid){
  const c=clients.find(v=>v.id===cid);if(!c)return[];
  const auto=(AUT[c.ccaa]||[]).map(v=>({...v,c:'autonomica'}));
  const custom=(c.customItems||[]).map(v=>({...v,c:'extra'}));
  return[...COM,...auto,...custom];
}
function gp(cid){
  const it=items(cid),pr=prog[cid]||new Set();
  const n=it.filter(i=>pr.has(i.id)).length;
  return{n,t:it.length,pct:it.length?Math.round(n/it.length*100):0};
}
function uid(p){return (p||'c')+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function pbar(pct){return`<div class="pt"><div class="pf ${pct===100?'pf-e':'pf-g'}" style="width:${pct}%"></div></div>`;}

// ═══════════════════════════════════════════════════════
//  NAVEGACIÓN
// ═══════════════════════════════════════════════════════
function nav(v,cid){vw=v;selC=cid||null;if(v!=='client')selCat='personales';uNav();rnd();}
function uNav(){
  ['dash','cli'].forEach(id=>{const el=document.getElementById('tb-'+id);if(el)el.classList.toggle('on',vw===id);});
  const tw=document.getElementById('tb-cw');
  if(selC){const c=clients.find(v=>v.id===selC);if(c)tw.innerHTML=`<button class="ntab on" onclick="nav('client','${c.id}')">${x(c.name)}</button>`;}
  else tw.innerHTML='';
}

//  RENDER PRINCIPAL
// ═══════════════════════════════════════════════════════
function rnd(){
  const el=document.getElementById('cnt');
  if(vw==='dash')el.innerHTML=rDash();
  else if(vw==='cli')el.innerHTML=rCli();
  else if(vw==='client')el.innerHTML=rDet();
}

// ── DASHBOARD ─────────────────────────────────────────
function rDash(){
  const tot=clients.length,bys=s=>clients.filter(c=>c.status===s).length;
  const avg=tot?Math.round(clients.reduce((a,c)=>a+gp(c.id).pct,0)/tot):0;
  return`<div class="sg">
    <div class="sc"><div class="scl">Total clientes</div><div class="scv">${tot}</div></div>
    <div class="sc"><div class="scl">Pendientes</div><div class="scv">${bys('pendiente')}</div></div>
    <div class="sc"><div class="scl">En proceso</div><div class="scv">${bys('en_proceso')}</div></div>
    <div class="sc"><div class="scl">Presentadas</div><div class="scv">${bys('presentado')}</div></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:12px;font-weight:500">Progreso medio de documentación</span>
      <span style="font-size:19px;font-weight:600;color:var(--gd)">${avg}%</span>
    </div>
    ${pbar(avg)}
    <div style="font-size:10px;color:var(--txt3);margin-top:5px">Basado en Manual AEAT Renta 2025 — Fuente: sede.agenciatributaria.gob.es</div>
  </div>
  <div class="sh">Clientes</div>
  ${tot===0
    ?`<div class="empty"><div style="font-size:2rem;margin-bottom:10px">◎</div><div style="font-size:13px;font-weight:500;margin-bottom:5px">Sin clientes todavía</div><div style="font-size:11px">Añade tu primer cliente con «+ Nuevo cliente»</div></div>`
    :`<div class="cg">${clients.map(c=>{const p=gp(c.id),st=ST[c.status]||ST.pendiente;return`<div class="cc" onclick="nav('client','${c.id}')">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="av">${x(c.name[0])}</div>
        <div><div style="font-size:12px;font-weight:500">${x(c.name)}</div><div style="font-size:10px;color:var(--txt2)">${x(c.nif)}</div></div>

      <span class="bdg ${st.cls}">${st.l}</span>
    </div>
    <div style="font-size:10px;color:var(--txt2);margin-bottom:6px">${ccn(c.ccaa)}</div>
    <div style="display:flex;align-items:center;gap:7px">${pbar(p.pct)}<span style="font-size:10px;color:var(--txt2);white-space:nowrap">${p.pct}% (${p.n}/${p.t})</span></div>
  </div>`;}).join('')}</div>`}`;
}

function exportPDF(cid){
  const c=clients.find(v=>v.id===cid);if(!c)return;
  const all=items(cid),pr=prog[cid]||new Set(),p=gp(cid),f=c.fiscal||{};

  // ── Documentos aportados (checked) agrupados por categoría ──
  const aportadoRows=[];
  CATS.forEach(cat=>{
    const checked=all.filter(i=>i.c===cat.id&&pr.has(i.id));
    const note=(c.catNotes||{})[cat.id]||'';
    checked.forEach(item=>{
      const key=driveKey(cid,item.id);
      const files=driveFiles[key]||[];
      const driveTag=files.length
        ?`<span style="font-size:8.5pt;color:#34A853;margin-left:6px">📎 Drive (${files.length})</span>`
        :'';
      aportadoRows.push(`<tr>
        <td style="padding:4px 10px 4px 0;color:#666;font-size:9pt;white-space:nowrap;vertical-align:top">${cat.l}</td>
        <td style="padding:4px 0;font-size:9.5pt;vertical-align:top">${x(item.t)}${driveTag}</td>
      </tr>`);
    });
    if(note.trim()){
      aportadoRows.push(`<tr>
        <td style="padding:3px 10px 6px 0;color:#888;font-size:8.5pt;white-space:nowrap;vertical-align:top;font-style:italic">↳ Nota ${cat.l}</td>
        <td style="padding:3px 0 6px 0;font-size:8.5pt;color:#555;font-style:italic;border-bottom:1px solid #f0f0f0">${x(note)}</td>
      </tr>`);
    }
  });

  // ── Advertencias: pendientes relevantes ──
  // Prioridad alta: items con w:true no marcados + items críticos no marcados
  const CRITICOS=['dni','cemp','sepe','ibi','bfis'];
  const warnings=[];

  // 1. Items marcados como advertencia (w:true) que faltan
  all.filter(i=>i.w&&!pr.has(i.id)).forEach(i=>{
    warnings.push({nivel:'alta',txt:i.t,det:i.d});
  });

  // 2. Documentos críticos sin marcar
  all.filter(i=>CRITICOS.includes(i.id)&&!pr.has(i.id)).forEach(i=>{
    warnings.push({nivel:'alta',txt:i.t,det:i.d});
  });

  // 3. Categorías con 0% de aportación (si tiene items)
  CATS.forEach(cat=>{
    if(cat.id==='extra')return;
    const ci=all.filter(i=>i.c===cat.id);
    if(ci.length===0)return;
    const cc=ci.filter(i=>pr.has(i.id)).length;
    if(cc===0){
      warnings.push({nivel:'media',txt:`Categoría "${cat.l}" — ningún documento aportado`,det:`${ci.length} documentos pendientes en esta sección.`});
    }
  });

  // 4. Items no marcados con Drive adjunto en otros items de su categoría (señal de que la categoría está activa pero el item se olvidó)
  CATS.forEach(cat=>{
    if(cat.id==='extra')return;
    const ci=all.filter(i=>i.c===cat.id);
    const anyDrive=ci.some(i=>(driveFiles[driveKey(cid,i.id)]||[]).length>0);
    if(anyDrive){
      ci.filter(i=>!pr.has(i.id)&&!i.w&&!CRITICOS.includes(i.id)).forEach(i=>{
        warnings.push({nivel:'baja',txt:i.t,det:i.d});
      });
    }
  });

  // Deduplicar warnings por texto
  const seen=new Set();
  const wUniq=warnings.filter(w=>{if(seen.has(w.txt))return false;seen.add(w.txt);return true;});
  const wAlta=wUniq.filter(w=>w.nivel==='alta');
  const wMedia=wUniq.filter(w=>w.nivel==='media');
  const wBaja=wUniq.filter(w=>w.nivel==='baja');

  const wRow=(w,color,ico)=>`<tr>
    <td style="padding:4px 8px 4px 0;vertical-align:top;font-size:13px">${ico}</td>
    <td style="padding:4px 0;vertical-align:top">
      <div style="font-size:9.5pt;font-weight:600;color:${color}">${x(w.txt)}</div>
      <div style="font-size:8.5pt;color:#666;margin-top:1px">${x(w.det)}</div>
    </td></tr>`;

  const wHtml=(!wAlta.length&&!wMedia.length&&!wBaja.length)
    ?`<div style="color:#34A853;font-size:10pt;padding:8px 0">✓ Sin advertencias — documentación completa.</div>`
    :`${wAlta.map(w=>wRow(w,'#B91C1C','🔴')).join('')}
      ${wMedia.map(w=>wRow(w,'#92400E','🟡')).join('')}
      ${wBaja.map(w=>wRow(w,'#374151','⚪')).join('')}`;

  const fiscHtml=`<table style="font-size:9pt;border-collapse:collapse;margin-bottom:4px">
    ${f.refCode?`<tr><td style="color:#666;padding:1px 10px 1px 0">Código ref.</td><td><strong>${x(f.refCode)}</strong></td></tr>`:''}
    ${f.dniExpiry?`<tr><td style="color:#666;padding:1px 10px 1px 0">Caducidad DNI</td><td>${x(f.dniExpiry)}</td></tr>`:''}
    ${f.dniPermanent&&f.dniSoporte?`<tr><td style="color:#666;padding:1px 10px 1px 0">Nº soporte</td><td>${x(f.dniSoporte)}</td></tr>`:''}
    ${f.casilla505?`<tr><td style="color:#666;padding:1px 10px 1px 0">Casilla 505</td><td>${x(f.casilla505)}</td></tr>`:''}
    ${f.noPrevRenta&&f.iban?`<tr><td style="color:#666;padding:1px 10px 1px 0">IBAN</td><td>${x(f.iban)}</td></tr>`:''}
  </table>`;

  const html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
  <title>Resumen Renta 2025 — ${x(c.name)}</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;color:#111;max-width:780px;margin:0 auto}
    h2{font-size:11pt;font-weight:700;color:#1E2A3A;border-bottom:1.5px solid #C8973A;padding-bottom:4px;margin:20px 0 10px}
    @page{margin:14mm}@media print{body{padding:0}}
  </style></head><body>

  <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #C8973A;padding-bottom:10px;margin-bottom:16px">
    <div>
      <div style="font-size:14pt;font-weight:700;color:#1E2A3A">Resumen Documentación — Renta 2025</div>
      <div style="font-size:10pt;color:#555;margin-top:3px">${x(c.name)} &nbsp;·&nbsp; ${x(c.nif)} &nbsp;·&nbsp; ${ccn(c.ccaa)}</div>
      ${c.notes?`<div style="font-size:9pt;color:#888;font-style:italic">${x(c.notes)}</div>`:''}
      ${fiscHtml}
    </div>
    <div style="text-align:right;flex-shrink:0;margin-left:20px">
      <div style="font-size:22pt;font-weight:700;color:#C8973A">${p.pct}%</div>
      <div style="font-size:9pt;color:#888">${p.n} de ${p.t} docs</div>
      <div style="font-size:9pt;color:#888;margin-top:2px">${new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'})}</div>
    </div>
  </div>

  <h2>✅ Documentación aportada</h2>
  ${aportadoRows.length
    ?`<table style="width:100%;border-collapse:collapse">${aportadoRows.join('')}</table>`
    :`<p style="color:#999;font-size:9.5pt">Ningún documento marcado todavía.</p>`}

  <h2>⚠️ Advertencias y pendientes</h2>
  <table style="width:100%;border-collapse:collapse">${wHtml}</table>

  <div style="margin-top:20px;padding-top:8px;border-top:1px solid #eee;font-size:8pt;color:#bbb">
    GestiónRenta · Manual AEAT Renta 2025 · ${new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'})}
  </div>
  <script>window.onload=function(){window.print();}<\/script>
  </body></html>`;

  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();}
  else alert('Permite las ventanas emergentes para este sitio e inténtalo de nuevo.');
}

function sCat(cat){selCat=cat;rnd();}

function togI(cid,iid){
  if(!prog[cid])prog[cid]=new Set();
  if(prog[cid].has(iid))prog[cid].delete(iid);else prog[cid].add(iid);
  svP(cid);
  const p=gp(cid),c=clients.find(v=>v.id===cid);
  if(c&&p.pct===100&&c.status==='pendiente'){c.status='completado';svC();}
  else if(c&&p.n>0&&c.status==='pendiente'){c.status='en_proceso';svC();}
  rnd();
}

function updSt(cid,val){const c=clients.find(v=>v.id===cid);if(c){c.status=val;svC();}}

function delC(cid){
  if(!confirm('¿Eliminar este cliente y todo su progreso? Esta acción no se puede deshacer.'))return;
  clients=clients.filter(v=>v.id!==cid);delete prog[cid];
  svC();try{localStorage.removeItem('gr-p-'+cid);}catch(e){}
  if(selC===cid)nav('cli');else rnd();
}

function addCustom(cid){
  const txt=document.getElementById('cx-txt')?.value.trim();
  const det=document.getElementById('cx-det')?.value.trim();
  if(!txt)return;
  const c=clients.find(v=>v.id===cid);if(!c)return;
  if(!c.customItems)c.customItems=[];
  c.customItems.push({id:uid('cx'),text:txt,detail:det});
  svC();rnd();
}

function rmCustom(cid,iid){
  const c=clients.find(v=>v.id===cid);if(!c||!c.customItems)return;
  c.customItems=c.customItems.filter(i=>i.id!==iid);
  if(prog[cid])prog[cid].delete(iid);
  svC();svP(cid);rnd();
}

const CLIENT_ID='863085062807-bm5c28kdrn14eo8qmo7av8is4f8bvg1a.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
let gToken=null,tokenClient=null,driveFiles={};

function loadDriveFiles(){
  try{const r=localStorage.getItem('gr-drive');if(r)driveFiles=JSON.parse(r);}catch(e){driveFiles={};}
}
function saveDriveFiles(){try{localStorage.setItem('gr-drive',JSON.stringify(driveFiles));}catch(e){}}
function driveKey(cid,iid){return cid+'__'+iid;}

function driveConnect(){
  if(gToken){gToken=null;uDriveBtn();rnd();return;}
  if(!tokenClient){
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID,scope:SCOPES,
      callback:(resp)=>{
        if(resp.error)return;
        gToken=resp.access_token;
        setTimeout(()=>{gToken=null;uDriveBtn();},3500*1000);
        uDriveBtn();rnd();
      }
    });
  }
  tokenClient.requestAccessToken({prompt:'consent'});
}

function uDriveBtn(){
  const btn=document.getElementById('drive-btn');
  const lbl=document.getElementById('drive-lbl');
  if(!btn||!lbl)return;
  if(gToken){btn.className='drive-btn connected';lbl.textContent='Drive conectado';}
  else{btn.className='drive-btn';lbl.textContent='Conectar Drive';}
}

async function apiReq(url,opts={}){
  if(!gToken)throw new Error('No autenticado');
  const r=await fetch(url,{...opts,headers:{...opts.headers,'Authorization':'Bearer '+gToken}});
  if(!r.ok)throw new Error('API error '+r.status);
  return r.json();
}

async function findOrCreateFolder(name,parentId){
  const q=`name='${name}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`;
  const res=await apiReq(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)`);
  if(res.files&&res.files.length>0)return res.files[0].id;
  const meta={name,mimeType:'application/vnd.google-apps.folder',parents:[parentId]};
  const created=await apiReq('https://www.googleapis.com/drive/v3/files?fields=id',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(meta)
  });
  return created.id;
}

async function getOrCreateRoot(){
  const q=`name='GestiónRenta 2025' and mimeType='application/vnd.google-apps.folder' and 'root' in parents and trashed=false`;
  const res=await apiReq(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)`);
  if(res.files&&res.files.length>0)return res.files[0].id;
  const meta={name:'GestiónRenta 2025',mimeType:'application/vnd.google-apps.folder'};
  const created=await apiReq('https://www.googleapis.com/drive/v3/files?fields=id',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(meta)
  });
  return created.id;
}

// ─ NOMBRE AUTOMÁTICO DE ARCHIVO ──────────────────────
function buildFileName(file,c,item,catLabel){
  const ext=file.name.includes('.')?'.'+file.name.split('.').pop().toLowerCase():'';
  const now=new Date();
  const ym=now.getFullYear().toString()+(String(now.getMonth()+1).padStart(2,'0'));
  // Slug del NIF
  const nif=c.nif.replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
  // Slug de categoría (abreviada)
  const catSlug={
    'Datos Personales':'Personal',
    'Rendimientos del Trabajo':'Trabajo',
    'Inmuebles y Alquileres':'Inmuebles',
    'Bancos e Inversiones':'Bancos',
    'Ganancias Patrimoniales':'Patrimonio',
    'Deducciones Estatales':'DedEstatal',
    'Deducciones Autonómicas':'DedAut',
    'Notas y docs. adicionales':'Extra',
  }[catLabel]||catLabel.replace(/\s+/g,'').slice(0,10);
  // Slug del documento (primeras palabras del título, limpio)
  const docSlug=item.t
    .replace(/[⚠️🍊🌻⚔️🌿⛵🌋🏔️⚙️🏰🌹🦅🐚🍇🏛️☀️⚜️🌊]/gu,'')
    .replace(/[^a-zA-ZáéíóúÁÉÍÓÚüÜñÑ0-9\s]/g,' ')
    .trim()
    .split(/\s+/)
    .slice(0,4)
    .map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase())
    .join('_');
  return `${nif}_${catSlug}_${docSlug}_${ym}${ext}`;
}

async function uploadToDrive(file,cid,iid,catLabel){
  if(!gToken){alert('Conecta primero con Google Drive (botón arriba a la derecha).');return;}
  const c=clients.find(v=>v.id===cid);if(!c)return;
  const btn=document.getElementById('upbtn-'+iid);
  if(btn){btn.classList.add('uploading');btn.textContent='Subiendo…';}
  try{
    const rootId=await getOrCreateRoot();
    const clientFolder=await findOrCreateFolder(c.nif+' — '+c.name,rootId);
    const catFolder=await findOrCreateFolder(catLabel,clientFolder);
    const item=items(cid).find(i=>i.id===iid)||{t:file.name};
    const renamedFile=buildFileName(file,c,item,catLabel);
    const meta={name:renamedFile,parents:[catFolder]};
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
    form.append('file',file);
    const resp=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',{
      method:'POST',headers:{'Authorization':'Bearer '+gToken},body:form
    });
    if(!resp.ok)throw new Error('Upload failed '+resp.status);
    const data=await resp.json();
    const key=driveKey(cid,iid);
    if(!driveFiles[key])driveFiles[key]=[];
    driveFiles[key].push({id:data.id,name:data.name,url:data.webViewLink,ts:Date.now()});
    saveDriveFiles();
    // auto-check the item if not already checked
    if(!prog[cid])prog[cid]=new Set();
    if(!prog[cid].has(iid)){prog[cid].add(iid);svP(cid);}
    rnd();
  }catch(e){
    console.error(e);
    if(btn){btn.classList.remove('uploading');btn.textContent='↑ Subir';}
    alert('Error al subir: '+e.message+'\n\nAsegúrate de tener Drive conectado.');
  }
}

function triggerUpload(cid,iid,catLabel){
  if(!gToken){alert('Conecta primero con Google Drive (botón arriba a la derecha).');return;}
  const inp=document.createElement('input');
  inp.type='file';inp.multiple=true;
  inp.accept='.pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx,.csv,.txt,.zip';
  inp.onchange=async()=>{
    for(const f of Array.from(inp.files))await uploadToDrive(f,cid,iid,catLabel);
  };
  inp.click();
}

function delDriveFile(cid,iid,fileId,e){
  e.stopPropagation();
  const key=driveKey(cid,iid);
  if(!driveFiles[key])return;
  driveFiles[key]=driveFiles[key].filter(f=>f.id!==fileId);
  saveDriveFiles();rnd();
}

      : p.pct===100
      ? `Te escribo para confirmarte que tenemos toda la documentación necesaria para preparar tu declaración de la Renta 2025. En breve me pongo con ella y te aviso en cuanto la tenga lista para revisar.`
      : `Te escribo para darte un avance sobre cómo llevamos tu declaración de la Renta 2025. Llevamos un ${p.pct}% de la documentación recibida — vamos bien, pero aún nos faltan algunas cosas para cerrarla.`;

    txt+=`${saludo}\n\n${intro}\n`;

    if(alertas.length){
      txt+=`\n⚠️ DOCUMENTACIÓN URGENTE / CON REQUISITOS ESPECIALES\n`;
      txt+=`${'─'.repeat(50)}\n`;
      alertas.forEach(i=>txt+=`• ${i.t}\n  → ${i.d}\n`);
    }

    if(pendientesCat.length&&p.pct<100){
      txt+=`\n📋 DOCUMENTACIÓN PENDIENTE DE RECIBIR\n`;
      txt+=`${'─'.repeat(50)}\n`;
      pendientesCat.forEach(({cat,items})=>{
        txt+=`\n${cat}:\n`;
        items.forEach(i=>txt+=`  • ${i.t}\n`);
      });
    }

    if(p.pct>0&&p.pct<100){
      txt+=`\n✅ LO QUE YA TENEMOS\n`;
      txt+=`${'─'.repeat(50)}\n`;
      txt+=`Hemos recibido documentación de ${catConDoc} categorías (${p.n} de ${p.t} documentos). ¡Gracias!\n`;
    }

    txt+=`\n📅 Recuerda que el plazo para presentar la declaración finaliza el ${plazo}, así que cuanto antes lo tengamos todo, mejor.\n`;
    txt+=`\nCualquier duda me dices. Puedes responder a este email o llamarme directamente.\n`;
    txt+=`\nUn saludo,\n[Tu nombre]\n[Asesoría] · [Teléfono]`;

  } else {
    // FORMAL
    const saludo=`Estimado/a Sr./Sra. ${c.name},`;
    const intro=p.pct===0
      ? `Me dirijo a usted para comunicarle el inicio de la campaña de declaración del Impuesto sobre la Renta de las Personas Físicas correspondiente al ejercicio 2024 (Renta 2025). Con el fin de poder elaborar su declaración de forma eficiente y maximizar las deducciones aplicables, le ruego proceda a la recopilación de la documentación que se detalla a continuación.`
      : p.pct===100
      ? `Me complace comunicarle que disponemos de toda la documentación necesaria para proceder a la elaboración de su declaración del IRPF correspondiente al ejercicio 2024. Les informaremos puntualmente una vez esté lista para su revisión y firma.`
      : `Me dirijo a usted para informarle del estado actual de la recopilación de documentación necesaria para la elaboración de su declaración del IRPF 2024. En la actualidad hemos recibido el ${p.pct}% de la documentación requerida. Le agradecería que procediera a remitir los documentos pendientes que se relacionan a continuación.`;

    txt+=`${saludo}\n\n${intro}\n`;

    if(alertas.length){
      txt+=`\nDOCUMENTACIÓN CON REQUISITOS ESPECIALES\n`;
      txt+=`${'─'.repeat(50)}\n`;
      alertas.forEach(i=>txt+=`- ${i.t}\n  Nota: ${i.d}\n`);
    }

    if(pendientesCat.length&&p.pct<100){
      txt+=`\nDOCUMENTACIÓN PENDIENTE DE APORTACIÓN\n`;
      txt+=`${'─'.repeat(50)}\n`;
      pendientesCat.forEach(({cat,items})=>{
        txt+=`\n${cat.toUpperCase()}:\n`;
        items.forEach(i=>txt+=`- ${i.t}\n`);
      });
    }

    if(p.pct>0&&p.pct<100){
      txt+=`\nDOCUMENTACIÓN YA RECIBIDA\n`;
      txt+=`${'─'.repeat(50)}\n`;
      txt+=`Se ha recibido documentación correspondiente a ${catConDoc} categorías (${p.n} de ${p.t} documentos solicitados).\n`;
    }

    txt+=`\nLe recordamos que el plazo de presentación de la declaración finaliza el ${plazo}. Para garantizar una tramitación adecuada, le rogamos que nos remita la documentación pendiente a la mayor brevedad posible.\n`;
    txt+=`\nQuedamos a su disposición para cualquier consulta.\n`;
    txt+=`\nAtentamente,\n[Nombre y apellidos]\n[Cargo] · [Asesoría]\n[Teléfono] · [Email]`;
  }

  document.getElementById('email-body').value=txt;
  // actualizar mailto
  const mb=document.getElementById('mailto-btn');
  mb.dataset.email=c.email||'';
  mb.dataset.asunto=`Declaración de la Renta 2025 — documentación${p.pct===100?' lista':'pendiente'}`;
}

function copyEmail(){
  const ta=document.getElementById('email-body');
  ta.select();
  document.execCommand('copy');
  const btn=document.getElementById('copy-btn');
  const orig=btn.textContent;
  btn.textContent='✓ Copiado';
  btn.style.background='var(--em)';
  setTimeout(()=>{btn.textContent=orig;btn.style.background='';},2000);
}

function mailtoEmail(){
  const mb=document.getElementById('mailto-btn');
  const email=mb.dataset.email||'';
  const asunto=encodeURIComponent(mb.dataset.asunto||'Declaración de la Renta 2025');
  const cuerpo=encodeURIComponent(document.getElementById('email-body').value);
  window.location.href=`mailto:${email}?subject=${asunto}&body=${cuerpo}`;
}

// ─ INIT ──────────────────────────────────────────────
loadAll();loadDriveFiles();uNav();rnd();
</script>
